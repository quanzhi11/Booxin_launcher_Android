<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Booxin 皮肤库 · 管理后台</title>
  <link rel="stylesheet" href="./admin.css" />
  <style>
    .preview-grid { display:grid; grid-template-columns: 180px 1fr; gap:12px; align-items:start; }
    .skin-thumb { width:96px; height:96px; image-rendering:pixelated; background:#111; border-radius:8px; }
    .viewer-frame {
      width:100%; height:320px; border:0; border-radius:12px; background:#1a1f2e;
    }
    .review-card .actions { display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
    #viewerModal {
      position:fixed; inset:0; background:rgba(0,0,0,.55); display:none;
      align-items:center; justify-content:center; z-index:50; padding:16px;
    }
    #viewerModal.open { display:flex; }
    #viewerModal .modal-card {
      width:min(920px, 100%); background:#fff; border-radius:16px; padding:16px;
    }
    #viewerModal .modal-actions { display:flex; gap:8px; justify-content:flex-end; margin-top:12px; }
  </style>
</head>
<body>
  <div id="loginGate" class="login-gate">
    <form id="loginForm" class="login-card card form">
      <h1>皮肤库管理登录</h1>
      <p class="muted">使用管理员用户名与密码登录。</p>
      <label>用户名 <input id="loginUsername" name="username" autocomplete="username" required /></label>
      <label>密码 <input id="loginPassword" name="password" type="password" autocomplete="current-password" required /></label>
      <button type="submit" class="primary">登录</button>
      <p id="loginMsg" class="muted"></p>
    </form>
  </div>

  <div id="appShell" class="app-shell hidden">
    <header class="top">
      <div>
        <h1>Booxin 皮肤库</h1>
        <p class="muted">审核时可直接预览 3D 穿戴模型；通过后上架到启动器社区。</p>
      </div>
      <div class="auth-box">
        <p id="authHint" class="muted">未登录</p>
        <button id="btnLogout" type="button">退出登录</button>
      </div>
    </header>

    <nav class="tabs">
      <button type="button" data-tab="pending" class="active">待审申请</button>
      <button type="button" data-tab="skins">已上架</button>
      <button type="button" data-tab="skinReports">皮肤举报</button>
      <button type="button" data-tab="reports">评论举报</button>
      <button type="button" data-tab="publish">直接上架</button>
    </nav>

    <main>
      <section id="tab-pending" class="panel active">
        <div class="row"><button type="button" id="btnRefreshPending">刷新</button></div>
        <div id="pendingList" class="list"></div>
      </section>
      <section id="tab-skins" class="panel">
        <div class="row"><button type="button" id="btnRefreshSkins">刷新</button></div>
        <div id="skinList" class="list"></div>
      </section>
      <section id="tab-skinReports" class="panel">
        <div class="row"><button type="button" id="btnRefreshSkinReports">刷新</button></div>
        <div id="skinReportList" class="list"></div>
      </section>
      <section id="tab-reports" class="panel">
        <div class="row"><button type="button" id="btnRefreshReports">刷新</button></div>
        <div id="reportList" class="list"></div>
      </section>
      <section id="tab-publish" class="panel">
        <form id="publishForm" class="card form">
          <h2>直接上架皮肤</h2>
          <label>名称 <input name="name" required /></label>
          <label>简介 <textarea name="description" rows="3"></textarea></label>
          <label>版本号 <input name="version" value="1.0.0" /></label>
          <label>模型
            <select name="model">
              <option value="classic">Classic</option>
              <option value="slim">Slim</option>
            </select>
          </label>
          <label>标签（逗号分隔） <input name="tags" placeholder="赛博,节日" /></label>
          <label>作者用户 ID <input name="authorUserId" placeholder="可选，默认管理员" /></label>
          <label>作者用户名 <input name="authorUsername" placeholder="可选" /></label>
          <label>皮肤 PNG <input type="file" name="file" accept="image/png,.png" required /></label>
          <button type="submit" class="primary">上架</button>
          <p id="publishMsg" class="muted"></p>
        </form>
      </section>
    </main>
  </div>

  <div id="viewerModal">
    <div class="modal-card">
      <h2 id="viewerTitle">3D 预览</h2>
      <iframe id="viewerFrame" class="viewer-frame" title="skin-3d"></iframe>
      <div class="modal-actions">
        <button type="button" id="btnCloseViewer">关闭</button>
      </div>
    </div>
  </div>

  <script src="./admin.js"></script>
</body>
</html>
