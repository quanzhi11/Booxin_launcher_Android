<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <style>
    html, body { margin:0; width:100%; height:100%; overflow:hidden; background:transparent; touch-action:none; }
    canvas { display:block; width:100%; height:100%; }
    #hint {
      position:absolute; left:0; right:0; bottom:8px; text-align:center;
      color:rgba(255,255,255,0.55); font:11px/1.3 sans-serif; pointer-events:none;
    }
  </style>
</head>
<body>
  <div id="hint">拖动旋转</div>
  <script src="three.min.js"></script>
  <script>
    (function () {
      var params = new URLSearchParams(location.search);
      var autoRotate = params.get("rotate") !== "0";
      var initialSkin = params.get("skin");

      var scene = new THREE.Scene();
      var camera = new THREE.PerspectiveCamera(35, 1, 0.05, 100);
      camera.position.set(1.05, 1.45, 2.85);
      camera.lookAt(0, 1.05, 0);

      var renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.setClearColor(0x000000, 0);
      if (renderer.outputEncoding !== undefined) renderer.outputEncoding = THREE.sRGBEncoding;
      document.body.appendChild(renderer.domElement);

      scene.add(new THREE.AmbientLight(0xffffff, 0.55));
      var hemi = new THREE.HemisphereLight(0xffffff, 0x334455, 0.85);
      scene.add(hemi);
      var key = new THREE.DirectionalLight(0xffffff, 0.85);
      key.position.set(2.5, 4, 2);
      scene.add(key);

      var player = new THREE.Group();
      scene.add(player);

      var dragging = false, lastX = 0, lastY = 0, rotY = 0, rotX = 0.08;
      var loadToken = 0;

      function setBoxUVs(geo, u, v, w, h, d) {
        var inset = 0.02;
        var faces = [
          [u + w + d, v + d, d, h],
          [u, v + d, d, h],
          [u + d, v, w, d],
          [u + d + w, v, w, d],
          [u + d, v + d, w, h],
          [u + d + w + d, v + d, w, h]
        ];
        var uvs = geo.attributes.uv;
        for (var fi = 0; fi < 6; fi++) {
          var f = faces[fi];
          var x0 = (f[0] + inset) / 64, x1 = (f[0] + f[2] - inset) / 64;
          var y0 = 1 - (f[1] + f[3] - inset) / 64, y1 = 1 - (f[1] + inset) / 64;
          var base = fi * 4;
          uvs.setXY(base + 0, x0, y1);
          uvs.setXY(base + 1, x1, y1);
          uvs.setXY(base + 2, x0, y0);
          uvs.setXY(base + 3, x1, y0);
        }
        uvs.needsUpdate = true;
      }

      function part(wPx, hPx, dPx, u, v, mat, x, y, z) {
        var s = 1 / 16;
        var geo = new THREE.BoxGeometry(wPx * s, hPx * s, dPx * s);
        setBoxUVs(geo, u, v, wPx, hPx, dPx);
        var mesh = new THREE.Mesh(geo, mat);
        mesh.position.set(x * s, y * s, z * s);
        return mesh;
      }

      function countOpaque(ctx, x, y, w, h) {
        var data = ctx.getImageData(x, y, w, h).data;
        var n = 0;
        for (var i = 3; i < data.length; i += 4) {
          if (data[i] >= 8) n++;
        }
        return n;
      }

      function sanitizeOverlays(ctx) {
        var regions = [
          [32, 0, 32, 16],
          [16, 32, 24, 16],
          [40, 32, 16, 16],
          [0, 32, 16, 16],
          [0, 48, 16, 16],
          [48, 48, 16, 16]
        ];
        for (var r = 0; r < regions.length; r++) {
          var box = regions[r];
          var opaque = countOpaque(ctx, box[0], box[1], box[2], box[3]);
          if (opaque > 0 && opaque < 10) {
            ctx.clearRect(box[0], box[1], box[2], box[3]);
          }
        }
      }

      function disposePlayer() {
        var disposedMap = null;
        while (player.children.length) {
          var child = player.children[0];
          player.remove(child);
          if (child.geometry) child.geometry.dispose();
          if (child.material) {
            var map = child.material.map;
            if (map && map !== disposedMap) {
              map.dispose();
              disposedMap = map;
            }
            child.material.map = null;
            child.material.dispose();
          }
        }
      }

      function buildPlayer(tex, slim, overlays) {
        disposePlayer();
        tex.magFilter = THREE.NearestFilter;
        tex.minFilter = THREE.NearestFilter;
        tex.generateMipmaps = false;
        if (tex.encoding !== undefined) tex.encoding = THREE.sRGBEncoding;
        tex.needsUpdate = true;

        var mat = new THREE.MeshLambertMaterial({
          map: tex, alphaTest: 0.5, side: THREE.FrontSide, transparent: false
        });
        var matOuter = new THREE.MeshLambertMaterial({
          map: tex, transparent: true, alphaTest: 0.55, side: THREE.FrontSide, depthWrite: false
        });

        player.add(part(8, 12, 4, 16, 16, mat, 0, 18, 0));
        player.add(part(8, 8, 8, 0, 0, mat, 0, 28, 0));
        player.add(part(4, 12, 4, 0, 16, mat, -2, 6, 0));
        player.add(part(4, 12, 4, 16, 48, mat, 2, 6, 0));
        if (slim) {
          player.add(part(3, 12, 4, 40, 16, mat, -5.5, 18, 0));
          player.add(part(3, 12, 4, 32, 48, mat, 5.5, 18, 0));
        } else {
          player.add(part(4, 12, 4, 40, 16, mat, -6, 18, 0));
          player.add(part(4, 12, 4, 32, 48, mat, 6, 18, 0));
        }
        if (overlays && overlays.hat) {
          player.add(part(8.5, 8.5, 8.5, 32, 0, matOuter, 0, 28, 0));
        }
        if (overlays && overlays.body) {
          player.add(part(8.5, 12.5, 4.5, 16, 32, matOuter, 0, 18, 0));
        }
        player.position.y = -0.05;
      }

      function isSlim(image) {
        try {
          var c = document.createElement("canvas");
          c.width = 64; c.height = 64;
          var ctx = c.getContext("2d");
          ctx.clearRect(0, 0, 64, 64);
          ctx.drawImage(image, 0, 0, 64, 64);
          var px = ctx.getImageData(54, 20, 1, 1).data;
          return px[3] < 128;
        } catch (e) {
          return false;
        }
      }

      function normalizeSkinImage(image, done) {
        try {
          var w = image.width || 64;
          var h = image.height || 64;
          var c = document.createElement("canvas");
          c.width = 64;
          c.height = 64;
          var ctx = c.getContext("2d");
          ctx.imageSmoothingEnabled = false;
          if (w === 64 && h === 32) {
            ctx.drawImage(image, 0, 0);
            ctx.drawImage(c, 0, 16, 16, 16, 16, 48, 16, 16);
            ctx.drawImage(c, 40, 16, 16, 16, 32, 48, 16, 16);
          } else {
            ctx.drawImage(image, 0, 0, 64, 64);
          }
          sanitizeOverlays(ctx);
          var overlays = {
            hat: countOpaque(ctx, 32, 0, 32, 16) >= 10,
            body: countOpaque(ctx, 16, 32, 24, 16) >= 10
          };
          var out = new Image();
          out.onload = function () { done(out, overlays); };
          out.onerror = function () { done(image, overlays); };
          out.src = c.toDataURL("image/png");
        } catch (e) {
          done(image, { hat: false, body: false });
        }
      }

      function applyTextureFromImage(image) {
        normalizeSkinImage(image, function (img, overlays) {
          var tex = new THREE.Texture(img);
          tex.needsUpdate = true;
          buildPlayer(tex, isSlim(img), overlays || { hat: false, body: false });
        });
      }

      function loadSkinUrl(url) {
        if (!url) {
          loadSkinUrl("default_steve.png");
          return;
        }
        var token = ++loadToken;
        var img = new Image();
        img.crossOrigin = "anonymous";
        img.onload = function () {
          if (token !== loadToken) return;
          applyTextureFromImage(img);
        };
        img.onerror = function () {
          if (token !== loadToken) return;
          if (url !== "default_steve.png") {
            loadSkinUrl("default_steve.png");
          }
        };
        img.src = url;
      }

      window.__booxinSetSkin = function (dataUrlOrPath) {
        if (dataUrlOrPath && typeof dataUrlOrPath === "string") {
          if (dataUrlOrPath.indexOf("data:image") === 0 ||
              dataUrlOrPath.indexOf("https://") === 0 ||
              dataUrlOrPath.indexOf("http://") === 0 ||
              dataUrlOrPath.indexOf("/") === 0) {
            loadSkinUrl(dataUrlOrPath);
            return;
          }
        }
        loadSkinUrl("default_steve.png");
      };

      if (initialSkin) {
        loadSkinUrl(initialSkin);
      } else if (window.__booxinPendingSkin) {
        window.__booxinSetSkin(window.__booxinPendingSkin);
        window.__booxinPendingSkin = null;
      } else {
        loadSkinUrl("default_steve.png");
      }

      function onResize() {
        var w = window.innerWidth || 1, h = window.innerHeight || 1;
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
        renderer.setSize(w, h, false);
      }
      window.addEventListener("resize", onResize);
      onResize();

      function down(e) {
        dragging = true;
        lastX = e.clientX || (e.touches && e.touches[0].clientX) || 0;
        lastY = e.clientY || (e.touches && e.touches[0].clientY) || 0;
      }
      function move(e) {
        if (!dragging) return;
        var x = e.clientX || (e.touches && e.touches[0].clientX) || 0;
        var y = e.clientY || (e.touches && e.touches[0].clientY) || 0;
        rotY += (x - lastX) * 0.01;
        rotX += (y - lastY) * 0.008;
        rotX = Math.max(-0.6, Math.min(0.6, rotX));
        lastX = x; lastY = y;
      }
      function up() { dragging = false; }
      renderer.domElement.addEventListener("pointerdown", down);
      renderer.domElement.addEventListener("pointermove", move);
      window.addEventListener("pointerup", up);
      renderer.domElement.addEventListener("touchstart", down, { passive: true });
      renderer.domElement.addEventListener("touchmove", move, { passive: true });
      window.addEventListener("touchend", up);

      function tick() {
        requestAnimationFrame(tick);
        if (autoRotate && !dragging) rotY += 0.008;
        player.rotation.y = rotY;
        player.rotation.x = rotX;
        renderer.render(scene, camera);
      }
      tick();
    })();
  </script>
</body>
</html>
